name: Android APK
on:
  push:
    branches: [mobile-apk]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm install --legacy-peer-deps
      - run: npx vite build --config vite.mobile.config.ts
      - run: npx cap sync android
      - name: Build (signed if secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.RECORDLY_KEYSTORE_B64 }}
          RECORDLY_STORE_PASSWORD: ${{ secrets.RECORDLY_STORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/recordly.jks"
            export RECORDLY_KEYSTORE="$RUNNER_TEMP/recordly.jks"
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: recordly-apk
          path: android/app/build/outputs/apk/**/*.apk
